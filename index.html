<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Lost & Found</title>
  <meta name="description" content="Campus Lost & Found - report and browse items (Google Sheets backend)" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div class="logo" id="logoWrap" title="Campus Lost & Found" aria-hidden="false">
        <!-- script.js will insert logo or fallback -->
      </div>
      <div class="brand">
        <h1>Campus Lost & Found</h1>
        <p class="muted">Report and recover lost items — powered by Google Sheets</p>
      </div>
    </header>

    <main class="container">
      <section class="panel" aria-labelledby="itemsHeading">
        <h2 id="itemsHeading">Available Items</h2>
        <input id="searchBox" class="search" placeholder="Search by item, place or contact..." aria-label="Search items" />
        <div id="itemsGrid" class="items-grid" aria-live="polite"></div>
        <div id="itemsEmpty" class="muted" style="display:none; padding:12px">No items yet. Add one using the form.</div>
      </section>

      <aside class="panel" aria-labelledby="addHeading">
        <h3 id="addHeading">Add Lost / Found Item</h3>
        <form id="itemForm" autocomplete="off">
          <div class="field">
            <label for="type">Type</label>
            <select id="type" required>
              <option value="Lost">Lost</option>
              <option value="Found">Found</option>
            </select>
          </div>

          <div class="field">
            <label for="title">Title (e.g., "Black Wallet")</label>
            <input id="title" type="text" placeholder="Short title" required />
          </div>

          <div class="field">
            <label for="desc">Description</label>
            <textarea id="desc" placeholder="Detailed description (color, brand, marks)"></textarea>
          </div>

          <div class="field">
            <label for="place">Place (where lost/found)</label>
            <input id="place" type="text" placeholder="e.g., Library, Canteen" />
          </div>

          <div class="field">
            <label for="date">Date (approx.)</label>
            <input id="date" type="text" placeholder="2025-11-04 or 'Yesterday'"/>
          </div>

          <div class="field">
            <label for="imageUrl">Image URL (optional)</label>
            <input id="imageUrl" type="url" placeholder="https://... (image must be public)" />
            <small class="muted">If you don't have an image, leave blank.</small>
          </div>

          <div class="field">
            <label for="contact">Contact (phone / email)</label>
            <input id="contact" type="text" placeholder="Owner/finder contact" />
          </div>

          <div class="form-actions">
            <button type="submit">Submit</button>
            <div id="submitMsg" class="muted" aria-live="polite"></div>
          </div>

          <div class="footer"><small class="muted">Note: Admins may verify entries. Avoid sharing sensitive info publicly.</small></div>
        </form>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
