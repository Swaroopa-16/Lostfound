<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LOGO (local uploaded file path) -->
  <img src="/mnt/data/cmrit_logo.webp" class="cmr-logo" alt="CMRIT logo">

  <header style="text-align:center; margin-top:6px;">
    <h1>Campus Lost & Found</h1>
    <p>Report lost or found items</p>
  </header>

  <!-- FORM CARD -->
  <div class="card">
    <h2>Submit Item</h2>

    <!-- Hidden iframe target for form POST -->
    <iframe name="post_target" id="post_target" style="display:none;"></iframe>

    <!-- Form posts to Apps Script (action must be your deployed /exec URL) -->
    <form id="itemForm" method="POST" target="post_target"
          action="https://script.google.com/macros/s/AKfycbzclTSeEeMwdtFt9q0sgorfOk4RFTcpigRt7XCRNJU2EbMzLMxWKtHCoFYv77pwtk-BEQ/exec">
      
      <label>Type</label>
      <select name="type" id="type">
        <option value="lost">lost</option>
        <option value="found">found</option>
      </select>

      <label>Item Name</label>
      <input name="item" id="item" placeholder="Example: Black Bag" required>

      <label>Description</label>
      <textarea name="description" id="description" placeholder="Color, brand, marks..."></textarea>

      <label>Location</label>
      <input name="location" id="location" placeholder="Where you lost/found it">

      <label>Contact</label>
      <input name="contact" id="contact" placeholder="Phone or email">

      <label>Date (optional)</label>
      <input type="date" name="date_event" id="date_event">

      <label>Your Name (optional)</label>
      <input name="reporter" id="reporter" placeholder="Name">

      <!-- Photo upload (optional) -->
      <label>Photo (optional)</label>
      <input type="file" id="photoFile" accept="image/*">
      <input type="hidden" name="photo" id="photo">
      <div id="photoPreview" style="margin-bottom:12px;"></div>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <p id="msg"></p>
  </div>

  <!-- LIST CARD -->
  <div class="card">
    <h2>All Items</h2>
    <button onclick="loadItems()">Refresh</button>
    <ul id="list"></ul>
  </div>

  <script src="script.js"></script>

  <!-- Small inline helper to wire file->base64 into the hidden input (if script.js missing) -->
  <script>
    (function(){
      const photoFileInput = document.getElementById('photoFile');
      const photoHiddenInput = document.getElementById('photo');
      const photoPreview = document.getElementById('photoPreview');

      if (!photoFileInput) return;

      photoFileInput.addEventListener('change', function() {
        const file = this.files && this.files[0];
        if (!file) {
          photoHiddenInput.value = '';
          photoPreview.innerHTML = '';
          return;
        }

        // show preview
        const readerPreview = new FileReader();
        readerPreview.onload = function(e) {
          photoPreview.innerHTML = '<img src="' + e.target.result + '" style="max-width:160px; max-height:120px; border-radius:6px; box-shadow:0 4px 10px rgba(0,0,0,0.12);" />';
        };
        readerPreview.readAsDataURL(file);

        // read as dataURL and put into hidden input
        const reader = new FileReader();
        reader.onload = function(e) {
          photoHiddenInput.value = e.target.result; // data:image/..;base64,...
        };
        reader.readAsDataURL(file);
      });
    })();
  </script>

</body>
</html>
