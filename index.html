<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LOGO -->
  <!-- For GitHub: upload 0.png to your repo and use "0.png" -->
  <img src="0.png" class="cmr-logo" alt="CMRIT logo">

  <header class="site-header">
    <div>
      <h1>Campus Lost & Found</h1>
      <p>Report lost or found items</p>
    </div>
  </header>

  <div class="card">
    <h2>Submit Item</h2>
    <iframe name="post_target" id="post_target" style="display:none;"></iframe>

    <form id="itemForm" method="POST" target="post_target"
      action="https://script.google.com/macros/s/AKfycbx6aMps78bYxgr1l_t0Tf7hHrk-CkLINr1oL-aykJMZ5Igc6WANjvKGvui4HIAcX_CzQA/exec">

      <label>Type</label>
      <select name="type" id="type">
        <option value="lost">Lost</option>
        <option value="found">Found</option>
      </select>

      <label>Item Name</label>
      <input name="item" id="item" required placeholder="Item name">

      <label>Description</label>
      <textarea name="description" id="description"></textarea>

      <label>Location</label>
      <input name="location" id="location">

      <label>Contact</label>
      <input name="contact" id="contact">

      <label>Date</label>
      <input type="date" name="date_event" id="date_event">

      <label>Your Name</label>
      <input name="reporter" id="reporter">

      <label>Photo (optional)</label>
      <input type="file" id="photoFile" accept="image/*">
      <input type="hidden" name="photo" id="photo">
      <div id="photoPreview"></div>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <p id="msg"></p>
  </div>

  <div class="card">
    <h2>All Items</h2>
    <button onclick="loadItems()">Refresh</button>
    <ul id="list"></ul>
  </div>

  <script src="script.js"></script>

  <script>
    console.log("loadItems type:", typeof loadItems);
  </script>

</body>
</html>
