<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LOGO -->
  <img src="cmrit_logo.webp" class="cmr-logo" alt="CMRIT logo">

  <header class="site-header">
    <h1>Campus Lost & Found</h1>
    <p>Report lost or found items</p>
  </header>

  <!-- FORM CARD -->
  <div class="card">
    <h2>Submit Item</h2>

    <form id="itemForm">

      <label>Type</label>
      <select id="type" required>
        <option value="lost">Lost</option>
        <option value="found">Found</option>
      </select>

      <label>Item Name</label>
      <input id="item" required placeholder="Example: Black Bag">

      <label>Description</label>
      <textarea id="description" placeholder="Color, brand, marks..."></textarea>

      <label>Location</label>
      <input id="location" placeholder="Where you lost/found it">

      <label>Contact</label>
      <input id="contact" placeholder="Phone or Email">

      <label>Date (Optional)</label>
      <input type="date" id="date_event">

      <label>Your Name</label>
      <input id="reporter" placeholder="Name">

      <label>Photo (Optional)</label>
      <input type="file" id="photoFile" accept="image/*">
      <input type="hidden" id="photo">
      <div id="photoPreview"></div>

      <button type="submit">Submit</button>
    </form>

    <p id="msg"></p>
  </div>

  <!-- LIST CARD -->
  <div class="card">
    <h2>All Items</h2>
    <button onclick="loadItems()">Refresh</button>
    <ul id="list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
