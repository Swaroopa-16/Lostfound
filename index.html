<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LOGO (must upload cmrit_logo.webp to repo root) -->
<img src="cmrit_logo.webp?v=2" class="cmr-logo" alt="CMRIT logo">

  <header class="site-header">
    <div>
      <h1>Campus Lost & Found</h1>
      <p>Report lost or found items</p>
    </div>
  </header>

  <!-- FORM CARD -->
  <div class="card">
    <h2>Submit Item</h2>

    <!-- Hidden iframe target for form POST -->
    <iframe name="post_target" id="post_target" style="display:none;"></iframe>

    <!-- Form posts to Apps Script (action must be your deployed /exec URL) -->
    <form id="itemForm" method="POST" target="post_target"
          action="https://script.google.com/macros/s/AKfycbx6aMps78bYxgr1l_t0Tf7hHrk-CkLINr1oL-aykJMZ5Igc6WANjvKGvui4HIAcX_CzQA/exec">
      
      <label>Type</label>
      <select name="type" id="type">
        <option value="lost">lost</option>
        <option value="found">found</option>
      </select>

      <label>Item Name</label>
      <input name="item" id="item" placeholder="Example: Black Bag" required>

      <label>Description</label>
      <textarea name="description" id="description" placeholder="Color, brand, marks..."></textarea>

      <label>Location</label>
      <input name="location" id="location" placeholder="Where you lost/found it">

      <label>Contact</label>
      <input name="contact" id="contact" placeholder="Phone or email">

      <label>Date (optional)</label>
      <input type="date" name="date_event" id="date_event">

      <label>Your Name (optional)</label>
      <input name="reporter" id="reporter" placeholder="Name">

      <!-- Photo upload (optional) -->
      <label>Photo (optional)</label>
      <input type="file" id="photoFile" accept="image/*">
      <input type="hidden" name="photo" id="photo">
      <div id="photoPreview" style="margin-bottom:12px;"></div>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <p id="msg"></p>
  </div>

  <!-- LIST CARD -->
  <div class="card">
    <h2>All Items</h2>
    <button onclick="loadItems()">Refresh</button>
    <ul id="list"></ul>
  </div>

  <script src="script.js"></script>

  <!-- DEBUG: shows whether loadItems function is loaded (remove later) -->
  <script>
    console.log('loadItems type ->', typeof loadItems);
  </script>
</body>
</html>
